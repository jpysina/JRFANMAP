name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure toolchain paths
        run: |
          echo "JRFANMAP_TOOLCHAIN_ROOT=$RUNNER_TEMP/jrfanmap-tools" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/jrfanmap-tools/.gradle" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore optional fixed debug signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            mkdir -p "$JRFANMAP_TOOLCHAIN_ROOT/android-user"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$JRFANMAP_TOOLCHAIN_ROOT/android-user/debug.keystore"
            chmod 600 "$JRFANMAP_TOOLCHAIN_ROOT/android-user/debug.keystore"
          fi
      - name: Install pinned tools, build APK, run unit tests and Lint
        run: python3 scripts/bootstrap-cloud.py
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JRFANMAP_TOOLCHAIN_ROOT/toolchains/jdk"
          "$JRFANMAP_TOOLCHAIN_ROOT/android-sdk/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/JRFANMAP-debug.apk
          cd dist
          sha256sum JRFANMAP-debug.apk > JRFANMAP-debug.apk.sha256
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: jrfanmap-apk-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Build Android instrumentation APK
        shell: bash
        run: |
          export JAVA_HOME="$JRFANMAP_TOOLCHAIN_ROOT/toolchains/jdk"
          export ANDROID_HOME="$JRFANMAP_TOOLCHAIN_ROOT/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_USER_HOME="$JRFANMAP_TOOLCHAIN_ROOT/android-user"
          ./gradlew :app:assembleDebugAndroidTest
      - name: Save instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: jrfanmap-device-test-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Save test and Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enable Android hardware acceleration
        id: kvm
        shell: bash
        run: |
          if [[ -c /dev/kvm ]]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Android device smoke tests skipped because this runner has no KVM.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: steps.kvm.outputs.available == 'true'
        with:
          name: jrfanmap-apk-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        if: steps.kvm.outputs.available == 'true'
        with:
          name: jrfanmap-device-test-${{ github.sha }}
          path: dist
      - name: Tap through debug APK in Android emulator
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: |
            adb emu geo fix 121.4737 31.2304
            adb install -r dist/JRFANMAP-debug.apk
            adb install -r dist/app-debug-androidTest.apk
            adb shell am instrument -w jp.jrfanmap.test/androidx.test.runner.AndroidJUnitRunner > android-emulator.txt
            cat android-emulator.txt
            mkdir -p ui-screenshots && for snapshot in portrait-collapsed portrait-expanded landscape-expanded; do adb exec-out run-as jp.jrfanmap cat "files/ui-screenshots/$snapshot.png" > "ui-screenshots/$snapshot.png"; test -s "ui-screenshots/$snapshot.png" || exit 1; done
            grep -E '^OK \([0-9]+ tests?\)' android-emulator.txt
      - name: Save emulator result
        if: always() && steps.kvm.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android-emulator.txt
            ui-screenshots/*.png
          retention-days: 14

  publish:
    needs: [build, emulator]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jrfanmap-apk-${{ github.sha }}
          path: dist
      - name: Publish APK from this source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY_CONFIGURED: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
        run: python3 scripts/publish-apk.py
